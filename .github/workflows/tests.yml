name: tests

on:
  push:
  pull_request:

jobs:
  privacy-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/privacy_check.py .
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .
