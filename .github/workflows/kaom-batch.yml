name: kaom-real-batch
on:
  push:
    branches: [kaom-crawl-probe-20261001]
  workflow_dispatch:
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependency
        run: pip install beautifulsoup4
      - name: Crawl real Kaom rows
        run: python kaom_batch.py
      - name: Upload real Kaom rows
        uses: actions/upload-artifact@v4
        with:
          name: kaom-real-batch-output
          path: kaom_batch_output/
          if-no-files-found: error
